<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Rush</title>
<meta name="description" content="Road Rush is a free 3D pixel car game. Dodge traffic, collect coins and unlock cars.">
<meta name="theme-color" content="#1b2a3a">
<meta property="og:title" content="Road Rush">
<meta property="og:description" content="A free 3D pixel car game. Dodge traffic, collect coins, climb the Top 10.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#7fd1e8;--ink:#fff7e0;--accent:#d9342b;--panel:rgba(22,30,44,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#7fd1e8;--ink:#fff7e0;--panel:rgba(22,30,44,.86)}}
:root[data-theme="dark"]{--bg:#7fd1e8;--ink:#fff7e0;--panel:rgba(22,30,44,.86)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Press Start 2P","Courier New",monospace;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;width:100%;height:100%;touch-action:none}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;font-size:10px;text-shadow:2px 2px 0 #1b2a3a;pointer-events:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
#ov .box{margin:auto;background:var(--panel);border:4px solid var(--ink);padding:24px 20px;max-width:340px;box-shadow:6px 6px 0 #1b2a3a}
h1{font-size:24px;letter-spacing:1px;line-height:1.4;margin:0 0 14px;color:#ffd95a;text-shadow:3px 3px 0 var(--accent)}
p{font-size:10px;line-height:1.9;margin:0 0 16px}
button{font:inherit;font-size:12px;color:var(--ink);background:var(--accent);border:4px solid var(--ink);padding:12px 18px;cursor:pointer;box-shadow:4px 4px 0 #1b2a3a}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b2a3a}
button:focus-visible{outline:4px solid #ffd95a;outline-offset:3px}
#pop{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:14px;color:#ffd95a;text-shadow:3px 3px 0 #1b2a3a;opacity:0;transition:opacity .4s;pointer-events:none}
#spd{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(255,255,255,0) 0 5deg,rgba(255,255,255,.22) 5deg 5.8deg);-webkit-mask-image:radial-gradient(circle at 50% 46%,transparent 38%,#000 85%);mask-image:radial-gradient(circle at 50% 46%,transparent 38%,#000 85%)}
.logo{font-size:36px!important;line-height:1.15;text-shadow:4px 4px 0 var(--accent),8px 8px 0 #1b2a3a}
.pcar{display:block;margin:22px auto 6px;width:70px;height:26px;position:relative;background:var(--accent);box-shadow:0 0 0 3px #1b2a3a;animation:drive 1.2s steps(14,end)}
.pcar::before{content:"";position:absolute;left:18px;top:-14px;width:34px;height:14px;background:#2a3a52}
.pcar::after{content:"";position:absolute;left:8px;bottom:-8px;width:14px;height:14px;background:#111;box-shadow:40px 0 0 #111}
@keyframes drive{from{transform:translateX(-190px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.pcar{animation:none}}
.big button{font-size:15px!important;padding:16px 22px!important}.big p,.big .row{font-size:12px}
.hc{--panel:#000}.hc #hud,.hc #pw,.hc #pop{text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}.hc canvas{filter:contrast(1.25) saturate(1.1)}
#pn{font:inherit;font-size:10px;padding:8px;border:3px solid var(--ink);background:#0f1722;color:var(--ink);width:150px;min-width:0}
.fl{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:14px;color:#ffd23a;text-shadow:2px 2px 0 #1b2a3a;pointer-events:none;animation:fl .8s ease-out forwards}
@keyframes fl{to{transform:translate(-50%,-60px);opacity:0}}@keyframes bump{50%{transform:scale(1.25)}}.bump{animation:bump .25s}
.bar{display:block;height:8px;border:2px solid var(--ink);margin:6px auto 0;width:140px;box-sizing:content-box}.bar b{display:block;height:100%;background:#ffd95a}
#title::after{content:"";display:block;height:6px;margin-top:12px;background:repeating-linear-gradient(90deg,#ffd95a 0 14px,transparent 14px 24px)}
.coin{display:inline-block;width:12px;height:12px;box-sizing:border-box;background:#ffd23a;box-shadow:inset -3px -3px 0 #e0a91b,inset 2px 2px 0 #fff0a0;vertical-align:-2px}
.ic{display:inline-block;width:12px;height:12px;vertical-align:-2px;position:relative;box-sizing:border-box}
.ic-dist{background:#3a3d4a;box-shadow:inset 0 0 0 2px #fff7e0}
.ic-dist::after{content:"";position:absolute;left:5px;top:2px;width:2px;height:8px;background:repeating-linear-gradient(#ffd95a 0 3px,transparent 3px 5px)}
.ic-best{background:#ffd95a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
#hud .cb{padding:3px 6px;border-width:2px;gap:5px}
.cb{display:inline-flex;align-items:center;gap:6px;background:rgba(20,28,40,.78);border:3px solid var(--ink);padding:4px 9px;box-shadow:2px 2px 0 #1b2a3a;font-size:inherit}.cb b{font-weight:normal}
#bankp .cb{font-size:12px}
.q{width:16px;height:16px;padding:0!important;font-size:8px!important;line-height:1;box-shadow:none!important;border:none!important;background:#2a3a52;margin-right:6px;vertical-align:middle}
.big .q{width:20px;height:20px;padding:0!important;font-size:10px!important}
.row>span{flex:1;min-width:0;text-align:left}.row>button{min-width:76px}
.tip{font-size:8px;line-height:1.8;text-align:left;margin:-4px 0 12px;opacity:.9}
.row small{font-size:7px;opacity:.8;line-height:2}
#pw{position:absolute;top:60px;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:10px;color:var(--ink);text-shadow:2px 2px 0 #1b2a3a;pointer-events:none}
#pw .cb{padding:3px 7px;border-width:2px}
#score{display:inline-block;min-width:60px;text-align:right}
.ic-nitro,.ic-shield,.ic-magnet,.ic-combo{box-shadow:inset -3px -3px 0 rgba(0,0,0,.22)}
.ic-nitro{background:#ff8a1f}.ic-shield{background:#66e0ff}.ic-magnet{background:#e05cff}.ic-combo{background:#ffd95a}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;font-size:9px;text-align:left}
.row button{font-size:9px;padding:6px 8px;box-shadow:2px 2px 0 #1b2a3a}.sw{display:inline-block;width:12px;height:12px;margin-right:6px;border:2px solid var(--ink)}
button:disabled{opacity:.6;cursor:default}#ov{overflow:auto}
#hud{align-items:center}#hud button{pointer-events:auto;padding:4px 8px;font-size:10px;border-width:3px;box-shadow:2px 2px 0 #1b2a3a}
#flash{position:absolute;inset:0;background:#ff3b2f;opacity:0;pointer-events:none;transition:opacity .35s}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="spd"></div><div id="flash"></div><div id="pw"></div><div id="pop"></div>
  <div id="hud"><span class="cb"><i class="ic ic-dist"></i><b id="score">0 m</b></span><span class="cb"><i class="coin"></i><b id="coins">0</b></span><span class="cb"><i class="ic ic-best"></i><b id="best">0</b></span><button id="mute" aria-label="Toggle sound">♪</button><button id="pause" aria-label="Pause" style="visibility:hidden"><svg width="12" height="12" viewBox="0 0 12 12" style="display:block"><rect x="1" width="4" height="12" fill="currentColor"/><rect x="7" width="4" height="12" fill="currentColor"/></svg></button></div>
  <div id="ov"><div class="box">
    <h1 id="title" class="logo">ROAD<br>RUSH</h1><i class="pcar" id="pcar"></i>
    <p id="msg">Dodge the traffic. Tap the left or right side of the screen, or use ← → keys, to change lanes.</p>
    <button id="go">Start driving</button>
    <div id="rstw" style="margin-top:14px;display:none"><button id="rst">Restart</button></div>
    <div id="gbw" style="margin-top:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><button id="gbtn">Garage</button> <button id="setbtn">Settings</button></div>
    <div id="misw" style="margin-top:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><button id="misbtn">Missions</button><button id="lbbtn">Top 10</button></div>
    <div id="howw" style="margin-top:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><button id="howbtn">How to play</button><button id="stbtn">Stats</button></div>
    <div id="spw" style="margin-top:14px"><button id="spbtn">Daily spin</button></div>
    <div id="rvw" style="margin-top:14px;display:none"><button id="rev">Revive</button></div>
    <div id="shw" style="margin-top:14px;display:none"><button id="share">Share score</button></div>
    <div id="menuw" style="margin-top:14px;display:none"><button id="menu">Main menu</button></div>
    <p id="bankp" style="margin:14px 0 0"></p>
    <p id="ver" style="font-size:8px;opacity:.7;margin:14px 0 0">v2.1.1</p>
  </div><div class="box" id="gar" style="display:none"></div><div class="box" id="set" style="display:none"></div><div class="box" id="mis" style="display:none"></div><div class="box" id="how" style="display:none"></div><div class="box" id="stp" style="display:none"></div><div class="box" id="spn" style="display:none"></div><div class="box" id="lb" style="display:none"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var SKY=0x7fd1e8, LANES=[-2.4,0,2.4,4.8],NL=3,SL=3,NLp=3;
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
var scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,35,120);
var camera=new THREE.PerspectiveCamera(60,1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.65));
var sun=new THREE.DirectionalLight(0xfff0c8,0.8);
sun.position.set(-8,14,6);scene.add(sun);

  var px=[3,2,1.5][save.gfx==null?2:save.gfx];

addEventListener('resize',resize);

// world
var ground=box(scene,220,1,320,0,-0.5,-110,0xe8c27a);
var roadM=box(scene,7.6,0.1,320,0,0.02,-110,0x3a3d4a);
box(scene,0.2,0.12,320,-3.7,0.05,-110,0xf5f0dc);
var edgeR=box(scene,0.2,0.12,320,3.7,0.05,-110,0xf5f0dc);
[[-40,10,0xc9743c],[-10,14,0xb5602f],[28,12,0xc9743c],[55,16,0xb5602f],[-62,12,0xb5602f]].forEach(function(m){
  box(scene,18,m[1],10,m[0],m[1]/2,-112,m[2]);box(scene,11,m[1]*0.5,8,m[0]+1,m[1]+m[1]*0.25,-112,m[2]);
});

var dashes=[],props=[],LOOP=96;
for(var i=0;i<16;i++){
  [-1.2,1.2,3.6].forEach(function(x){dashes.push(box(scene,0.2,0.12,2.2,x,0.05,-i*6,0xf5f0dc));});
}
function makeProp(){
  var g=new THREE.Group();
  var cac=Math.random()<0.65;
  if(cac){
    box(g,0.7,2.6,0.7,0,1.3,0,0x3f9a4a);box(g,0.5,0.5,0.5,-0.6,1.5,0,0x3f9a4a);box(g,0.4,1,0.4,-0.8,1.9,0,0x3f9a4a);
    box(g,0.5,0.5,0.5,0.6,1.1,0,0x3f9a4a);box(g,0.4,0.9,0.4,0.8,1.5,0,0x3f9a4a);
  }else{box(g,1.4,0.9,1.2,0,0.45,0,0x8d8478);box(g,0.8,0.5,0.7,0.2,1.1,0,0x9d9488);}
  g.userData.cap=box(g,1.1,0.3,1.1,0,cac?2.7:1.4,0,0xffffff);g.userData.cap.visible=false;
  return g;
}
for(var j=0;j<22;j++){
  var p=makeProp(),side=j%2?1:-1;
  p.position.set(side*(7.5+Math.random()*14),0,-(j/22)*LOOP);
  scene.add(p);props.push(p);
}
var poles=[];
var RN=300,rpos=new Float32Array(RN*3);
for(var r=0;r<RN;r++){rpos[r*3]=(Math.random()-0.5)*30;rpos[r*3+1]=Math.random()*14;rpos[r*3+2]=-Math.random()*40+6;}
var rainG=new THREE.BufferGeometry();rainG.setAttribute('position',new THREE.BufferAttribute(rpos,3));
var rain=new THREE.Points(rainG,new THREE.PointsMaterial({color:0xcfe3ff,size:0.28,transparent:true,opacity:0}));
rain.frustumCulled=false;rain.visible=false;scene.add(rain);
var bld=[],wc=document.createElement('canvas');wc.width=wc.height=32;
(function(){var x=wc.getContext('2d');x.fillStyle='#d9dee6';x.fillRect(0,0,32,32);for(var a=0;a<4;a++)for(var b=0;b<4;b++){x.fillStyle=Math.random()<0.35?'#ffe28a':'#2a3a52';x.fillRect(a*8+1,b*8+2,5,5);}})();
var wtex=new THREE.CanvasTexture(wc);wtex.wrapS=wtex.wrapT=THREE.RepeatWrapping;wtex.magFilter=THREE.NearestFilter;wtex.minFilter=THREE.NearestFilter;
var BC=[0xb8c4d6,0xd7b9a0,0x9fb3a8,0xc9c9d6,0xa9a3c4];
for(var bi2=0;bi2<16;bi2++){
  var bw=5+Math.random()*4,bh=10+Math.random()*22,bd=6+Math.random()*4,wt=wtex.clone();wt.needsUpdate=true;wt.repeat.set(Math.round(bw/2.5),Math.round(bh/2.5));
  var bm=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),new THREE.MeshLambertMaterial({color:BC[bi2%5],map:wt}));
  bm.position.set((bi2%2?1:-1)*(9+bw/2+Math.random()*5),bh/2,-(bi2/16)*LOOP);bm.visible=false;scene.add(bm);bld.push(bm);
}
var tun=new THREE.Group();
box(tun,10,0.6,320,0,5.2,-110,0x2b2f38);box(tun,0.8,5.5,320,-4.9,2.6,-110,0x3a3f4a);box(tun,0.8,5.5,320,4.9,2.6,-110,0x3a3f4a);
tun.visible=false;scene.add(tun);
var tl=[];for(var ti=0;ti<16;ti++){var tb=box(scene,1.2,0.12,0.6,0,4.8,-ti*6,0xfff3c0);tb.material=new THREE.MeshBasicMaterial({color:0xfff3c0});tb.visible=false;tl.push(tb);}
var brg=new THREE.Group();box(brg,0.25,0.9,320,-3.95,0.5,-110,0x9aa3ad);box(brg,0.25,0.9,320,3.95,0.5,-110,0x9aa3ad);brg.visible=false;scene.add(brg);
var trees=[],palms=[];
for(var ti2=0;ti2<20;ti2++){var tg2=new THREE.Group();box(tg2,0.5,1.8,0.5,0,0.9,0,0x6b4a2b);box(tg2,2.4,1.1,2.4,0,2.3,0,0x2f7a3a);box(tg2,1.7,1.1,1.7,0,3.2,0,0x3a8f46);box(tg2,0.9,1,0.9,0,4.1,0,0x4aa356);tg2.position.set((ti2%2?1:-1)*(7.5+Math.random()*12),0,-(ti2/20)*LOOP);tg2.visible=false;scene.add(tg2);trees.push(tg2);}
for(var pi2=0;pi2<10;pi2++){var pm=new THREE.Group();box(pm,0.4,3.2,0.4,0,1.6,0,0x9a7a4a);box(pm,3,0.2,0.8,0,3.3,0,0x3fae4a);box(pm,0.8,0.2,3,0,3.35,0,0x3fae4a);pm.position.set(7.5+Math.random()*10,0,-(pi2/10)*LOOP);pm.visible=false;scene.add(pm);palms.push(pm);}
var sea=box(scene,100,0.1,320,-62,0.03,-110,0x2f8fd8);sea.visible=false;


for(var l=0;l<12;l++){
  var pg=new THREE.Group();box(pg,0.2,4,0.2,0,2,0,0x333a44);box(pg,1.4,0.2,0.2,0.6,4,0,0x333a44);
  box(pg,0.5,0.2,0.5,1.2,3.85,0,0xfff0b0).material=new THREE.MeshBasicMaterial({color:0xfff0b0});
  pg.position.set(l%2?4.7:-4.7,0,-(l/12)*LOOP);if(!(l%2))pg.rotation.y=Math.PI;
  pg.visible=false;scene.add(pg);poles.push(pg);
}

function makeBase(color){
  var g=new THREE.Group();
  box(g,1.7,0.6,3.4,0,0.6,0,color);
  box(g,1.4,0.5,1.5,0,1.12,0.2,0x253447);
  box(g,1.4,0.1,1.3,0,1.42,0.2,color);
  [[-0.9,-1.1],[0.9,-1.1],[-0.9,1.1],[0.9,1.1]].forEach(function(w){box(g,0.35,0.55,0.7,w[0],0.28,w[1],0x111418);});
  box(g,0.45,0.2,0.06,-0.55,0.72,1.72,0xff5544);box(g,0.45,0.2,0.06,0.55,0.72,1.72,0xff5544);
  box(g,0.4,0.18,0.06,-0.55,0.7,-1.72,0xfff3a0);box(g,0.4,0.18,0.06,0.55,0.7,-1.72,0xfff3a0);

var TRAFFIC_COLORS=[0x2f6fdb,0xf2b632,0x7a4fc7,0x2fb37a,0xeeeeee,0xe97bb0];

  var g=new THREE.Group(),c=TRAFFIC_COLORS[Math.floor(Math.random()*TRAFFIC_COLORS.length)];
  box(g,2,2.1,3.6,0,1.45,0.8,0xeeeeee);box(g,1.9,1.4,1.2,0,1.0,-1.6,c);box(g,1.7,0.5,0.1,0,1.5,-2.2,0x253447);

  box(g,0.5,0.25,0.06,-0.6,0.8,2.62,0xff5544);box(g,0.5,0.25,0.06,0.6,0.8,2.62,0xff5544);
  return g;
}
function makeCoin(){return new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.15),mat(0xffd23a));}
var PU=[0xff8a1f,0x66e0ff,0xe05cff];
function makeVar(color,ty){
  var g=new THREE.Group(),dark=0x253447,tire=0x111418;
  function W(w,h,d,x,y,z,c){return box(g,w,h,d,x,y,z,c);}

  if(ty===1){W(1.8,0.45,3.4,0,0.5,0,color);W(1.3,0.4,1.4,0,0.9,0.3,dark);W(1.3,0.08,1.2,0,1.14,0.3,color);W(1.7,0.1,0.4,0,1.05,1.55,tire);P.forEach(function(w){W(0.35,0.45,0.7,w[0],0.23,w[1],tire);});}
  else if(ty===2){W(1.9,0.7,3.4,0,1.15,0,color);W(1.5,0.6,1.5,0,1.8,0.2,dark);W(1.5,0.1,1.3,0,2.15,0.2,color);P.forEach(function(w){W(0.6,1.1,1.1,w[0]*1.1,0.55,w[1],tire);});}
  else{W(2.0,1.7,3.4,0,1.15,0,color);W(2.04,0.5,3.0,0,1.5,0,dark);W(1.9,0.15,3.2,0,2.05,0,0xffffff);P.forEach(function(w){W(0.35,0.55,0.8,w[0]*1.05,0.28,w[1],tire);});}

  if(NL!==NLp){holdT=0;if(NL===3){if(lane===3)graceT=Math.max(graceT,1.5);lane=Math.min(lane,2);[traffic,coinsArr,oils,ramps,pickups].forEach(function(arr){for(var xi=arr.length-1;xi>=0;xi--)if(arr[xi].position.x>3.6){scene.remove(arr[xi]);arr.splice(xi,1);}});}else{popup('Four lanes!');fill3();}NLp=NL;}
  if(NL===4&&dmw>262&&!nwMsg){nwMsg=true;popup('Road narrows soon!');}if(NL===3)nwMsg=false;
  var moving=state==='play'||state==='ready';
  var v=state==='play'?speed*(nitroT>0?1.6:1):0;

  if(state==='play'){
    speed=Math.min(62+3*up().s,speed+0.6*dt);
    dist+=v*dt*0.25*mult();
    if(dist>=nextBoss){nextBoss+=500;bossPending=true;}
    spawnT-=(v-9)*dt;
    if(spawnT<=0){spawn();spawnT=((36-diff()*10)+Math.random()*(12-diff()*4))*(ev===1?0.75:1)+(bossJust?55:0);bossJust=false;}
    $('score').textContent=Math.floor(dist)+' m';
    nitroT=Math.max(0,nitroT-dt);magT=Math.max(0,magT-dt);slipT=Math.max(0,slipT-dt);graceT=Math.max(0,graceT-dt);
    comboT-=dt;if(comboT<=0)comboN=0;
    rockT-=dt;if(ev===3&&rockT<=0){rockT=1.1;var occ=[0,0,0];traffic.forEach(function(q){if(Math.abs(q.position.z+60)<16)occ[Math.max(0,Math.min(3,Math.round(q.position.x/2.4)+1))]=1;});oils.forEach(function(q){if(Math.abs(q.position.z+60)<30)occ[Math.max(0,Math.min(3,Math.round(q.position.x/2.4)+1))]=1;});
    var fl=[0,1,2,3].slice(0,SL).filter(function(i){return !occ[i];});
    if(fl.length>1){var rk=makeRock();rk.userData={hw:1.5,hl:1.7,sp:9,minD:99,done:false,fall:true};rk.position.set(LANES[fl[Math.floor(Math.random()*fl.length)]],14,-60);scene.add(rk);traffic.push(rk);}}
    if(jumpT>0){jumpT-=dt;if(jumpT<=0){jumpT=0;bonus(5);popup('Air time! +5');}}madd(1,v*dt*0.25);save.tot=(save.tot||0)+v*dt*0.25;
    var pw=[];if(nitroT>0)pw.push(['ic-nitro','Nitro '+Math.ceil(nitroT)+'s']);if(shield>0)pw.push(['ic-shield','Shield'+(shield>1?' x'+shield:'')]);if(magT>0)pw.push(['ic-magnet','Magnet '+Math.ceil(magT)+'s']);if(mult()>1)pw.push(['ic-combo','x'+mult()]);
    var ph=pw.map(function(a){return '<span class="cb"><i class="ic '+a[0]+'"></i><b>'+a[1]+'</b></span>';}).join('');
    if(ph!==pwHtml){pwHtml=ph;$('pw').innerHTML=ph;}
  }

  // scroll world
  if(moving){
    dashes.forEach(function(d){d.position.z+=v*dt;if(d.position.z>8)d.position.z-=LOOP;});
    poles.forEach(function(q){q.position.z+=v*dt;if(q.position.z>8)q.position.z-=LOOP;});
    bld.forEach(function(q){q.position.z+=v*dt;if(q.position.z>14)q.position.z-=LOOP;});
    tl.forEach(function(q){q.position.z+=v*dt;if(q.position.z>8)q.position.z-=96;});
    [trees,palms].forEach(function(arr){arr.forEach(function(q){q.position.z+=v*dt;if(q.position.z>8)q.position.z-=LOOP;});});
    props.forEach(function(p){p.position.z+=v*dt;if(p.position.z>8){p.position.z-=LOOP;p.position.x=(p.position.x<0?-1:1)*(7.5+Math.random()*14);}});
  }
  for(var i=traffic.length-1;i>=0;i--){
    var c=traffic[i];
    var u=c.userData,hwe=u.hw-S.nar;
    if(u.fall&&c.position.y>0)c.position.y=Math.max(0,c.position.y-26*dt);
    if(u.wv)c.position.x=u.bx+Math.sin(t/500+i)*0.55;if(u.lamp)u.lamp.material.color.setHex(Math.floor(t/150)%2?0xff2a2a:0x2a6aff);
    if(u.brk){var bk=Math.sin(t/900+u.bt)>0.88;u.brk.material.color.setHex(bk?0xff2a2a:0x661111);if(bk)c.position.z+=4*dt;}
    if(state==='play')c.position.z+=(v-u.sp)*dt;
    if(c.position.z>10){scene.remove(c);traffic.splice(i,1);continue;}
    if(state==='play'){
      var dxs=Math.abs(c.position.x-px);
      if(Math.abs(c.position.z)<u.hl)u.minD=Math.min(u.minD,dxs);
      else if(c.position.z>=u.hl&&!u.done){u.done=true;if(u.minD>=hwe&&u.minD<hwe+0.4)nearMiss();}
    }
    if(state==='play'&&jumpT<=0&&(!u.fall||c.position.y<1.5)&&Math.abs(c.position.z)<u.hl&&Math.abs(c.position.x-px)<hwe){
      if(nitroT>0||graceT>0||shield>0){if(nitroT<=0&&graceT<=0){shield--;shieldM.visible=shield>0;}scene.remove(c);traffic.splice(i,1);shake=0.6;tone(300,0.25,'square',0.2,60);continue;}
      crash();
    }
  }
  for(var k=coinsArr.length-1;k>=0;k--){
    var co=coinsArr[k];
    if(state==='play')co.position.z+=v*dt;
    co.rotation.y+=dt*4;
    if(magT>0&&state==='play'&&co.position.z>-14-5*up().m&&co.position.z<2)co.position.x+=(px-co.position.x)*Math.min(1,dt*8);
    if(co.position.z>10){scene.remove(co);coinsArr.splice(k,1);continue;}
    if(state==='play'&&Math.abs(co.position.z)<1.8&&Math.abs(co.position.x-px)<1.3){
      scene.remove(co);coinsArr.splice(k,1);coinAcc+=S.coin;var g=Math.floor(coinAcc);coinAcc-=g;g*=mult();coinCount+=g;save.bank+=g;vib(8);sti('k',g);madd(0,g);chk();persist();updateBank();$('coins').textContent=coinCount;coinSfx();flo('+'+g);var cbx=$('coins').parentNode;cbx.classList.remove('bump');void cbx.offsetWidth;cbx.classList.add('bump');
    }
  }
  for(var m2=pickups.length-1;m2>=0;m2--){
    var pk=pickups[m2];
    if(state==='play')pk.position.z+=v*dt;
    pk.rotation.y+=dt*3;pk.rotation.x+=dt*2;
    if(pk.position.z>10){scene.remove(pk);pickups.splice(m2,1);continue;}
    if(state==='play'&&Math.abs(pk.position.z)<1.9&&Math.abs(pk.position.x-px)<1.4){
      var ty=pk.userData.t;scene.remove(pk);pickups.splice(m2,1);
      var was=ty===0?nitroT>0:ty===1?shield>0:magT>0;
      if(ty===0)nitroT=Math.min(10,nitroT+3.5);else if(ty===1){shield=Math.min(3,shield+1);shieldM.visible=true;}else magT=Math.min(20,magT+8);
      if(was)popup('Stacked!');
      tone(520,0.12,'triangle',0.15,1040);
    }
  }
  for(var o=oils.length-1;o>=0;o--){
    var ol2=oils[o];
    if(state==='play')ol2.position.z+=v*dt;
    if(ol2.position.z>10){scene.remove(ol2);oils.splice(o,1);continue;}
    if(state==='play'&&!ol2.userData.hit&&Math.abs(ol2.position.z)<2&&Math.abs(ol2.position.x-px)<1.5){ol2.userData.hit=1;if(nitroT<=0){slipT=1;tone(200,0.3,'sawtooth',0.12,90);popup('Slippery!');}}
  }
  for(var rr=ramps.length-1;rr>=0;rr--){
    var rp2=ramps[rr];
    if(state==='play')rp2.position.z+=v*dt;
    if(rp2.position.z>10){scene.remove(rp2);ramps.splice(rr,1);continue;}
    if(state==='play'&&jumpT<=0&&!rp2.userData.hit&&Math.abs(rp2.position.z)<2&&Math.abs(rp2.position.x-px)<1.4){rp2.userData.hit=1;jumpT=1.1;tone(400,0.25,'triangle',0.15,900);vib(30);}
  }

  // player
  for(var di=debris.length-1;di>=0;di--){var db=debris[di];db.vy-=22*dt;db.m.position.x+=db.vx*dt;db.m.position.y+=db.vy*dt;db.m.position.z+=db.vz*dt;db.m.rotation.x+=dt*6;
    if(db.m.position.y<0.15){db.m.position.y=0.15;db.vy*=-0.3;db.vx*=0.6;db.vz*=0.6;}
    db.l-=dt;if(db.l<0){scene.remove(db.m);debris.splice(di,1);}}
  for(var pf=puffs.length-1;pf>=0;pf--){var pq=puffs[pf];pq.m.position.z+=v*dt;
    if(pq.t){if(pq.m.position.z>12){scene.remove(pq.m);puffs.splice(pf,1);}}
    else{pq.l-=dt;pq.m.position.y+=dt*1.5;pq.m.scale.setScalar(1+(0.6-pq.l)*3);pq.m.material.opacity=Math.max(0,pq.l);if(pq.l<=0){scene.remove(pq.m);puffs.splice(pf,1);}}}
  var tx=LANES[lane],dx=tx-px;
  px+=dx*Math.min(1,dt*S.agi*(1-0.4*rainK));
  player.position.x=px;
  player.visible=graceT<=0||Math.floor(t/90)%2===0;
  if(state==='over'){player.rotation.z=0;}
  else if(state==='ready'){player.rotation.y+=dt*0.9;player.rotation.z=0;}
  else{player.rotation.y=-dx*0.12+(slipT>0?Math.sin(t/45)*0.35:0);player.rotation.z=-dx*0.05;}
  if(state==='play')player.position.y=jumpT>0?Math.sin((1-jumpT/1.1)*Math.PI)*3.2:Math.sin(t/60)*0.02;

  // camera
  shake=Math.max(0,shake-dt*2.5);
  var cp=CAMP[save.cam||0],sk=save.calm?shake*0.15:shake;camera.position.set(px*cp.fx+(Math.random()-0.5)*sk*0.6,cp.y+(Math.random()-0.5)*sk*0.4,cp.z);
  if(state==='ready')camera.position.x+=Math.sin(t/2500)*2.2;
  camera.lookAt(px*0.4,cp.ly,cp.lz);

  var b=BIOMES[Math.floor(dist/150)%9],dm=dist%1000,zone=dm>700&&dm<850?1:dm>350&&dm<500?2:0;
  if(zone!==lastZone){lastZone=zone;if(zone===1)popup('Tunnel!');else if(zone===2)popup('Bridge!');}
  curSky.lerp(bt.set(zone===1?0x15171d:b[0]),dt*0.8);curGround.lerp(bt.set(zone===2?0x3a7ab8:b[1]),dt*0.8);curAmb+=((zone===1?0.3:b[2])-curAmb)*dt*0.8;
  var dk=0.5+0.5*Math.sin(dist/350);bt.copy(curSky).multiplyScalar(0.72+0.28*dk);scene.background.copy(bt);scene.fog.color.copy(bt);sun.intensity=0.45+0.4*dk;sun.color.setRGB(1,0.8+0.2*dk,0.6+0.4*dk);ground.material.color.copy(curGround);ambient.intensity=curAmb*(0.8+0.2*dk);
  var nf=Math.max(0,Math.min(1,(0.48-curAmb)/0.15)),on=nf>0.05&&state!=='ready';
  rig.position.x=px;
  hglow.forEach(function(g){g.visible=nf>0.1;});
  var bI=Math.floor(dist/150)%9,city=(bI===5||bI===8)&&zone===0,fo=bI===6&&zone===0,bc=bI===7&&zone===0,neon=bI===8;
  trees.forEach(function(q){q.visible=fo;});palms.forEach(function(q){q.visible=bc;});sea.visible=bc;
  if(neon!==neonOn){neonOn=neon;bld.forEach(function(q,i){q.material.emissive.setHex(neon?(i%2?0xff2a9a:0x2ae6ff):0);q.material.emissiveIntensity=0.55;});}poles.forEach(function(q,i){q.visible=(nf>0.3||city)&&zone===0&&!(ww>0.3&&i%2);});bld.forEach(function(q){q.visible=city;});
  
  ww+=((NL===4?1:0)-ww)*Math.min(1,dt*2.5);roadM.scale.x=1+0.289*ww;roadM.position.x=1.1*ww;edgeR.position.x=3.7+2.4*ww;
  dashes.forEach(function(d){if(d.position.x>3)d.visible=ww>0.6;});
  tun.visible=zone===1;brg.visible=zone===2;tl.forEach(function(q){q.visible=zone===1;});
  flames.forEach(function(f){f.visible=nitroT>0;var sc=1+Math.random()*1.4;f.scale.z=sc;f.position.z=1.75+sc*0.5;});
  var so=!save.calm&&(nitroT>0||(state==='play'&&speed>48));if(so!==spdOn){spdOn=so;$('spd').style.opacity=so?0.8:0;}
  rainK+=((Math.floor(dist/150)%9===4?1:0)-rainK)*Math.min(1,dt*0.8);rain.visible=rainK>0.03;rain.material.opacity=rainK*0.75;
  if(rain.visible){for(var ri=0;ri<RN;ri++){rpos[ri*3+1]-=38*dt;if(rpos[ri*3+1]<0){rpos[ri*3+1]=14;rpos[ri*3]=(Math.random()-0.5)*30;rpos[ri*3+2]=-Math.random()*40+6;}}rainG.attributes.position.needsUpdate=true;}
  var snow=Math.floor(dist/150)%9===3;props.forEach(function(q){q.userData.cap.visible=snow;q.visible=!city&&!fo&&!bc&&zone===0;});
  lamps.forEach(function(l){l.intensity=on?nf*1.8:0;});
  beams.forEach(function(b){b.visible=on;b.material.opacity=nf*0.32;});
  camera.fov+=((nitroT>0?80:60)-camera.fov)*Math.min(1,dt*5);camera.updateProjectionMatrix();
  renderer.render(scene,camera);
}
resize();requestAnimationFrame(frame);
})();
