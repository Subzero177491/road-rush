<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Rush</title>
<meta name="description" content="Road Rush is a free 3D pixel car game. Dodge traffic, collect coins and unlock cars.">
<meta name="theme-color" content="#1b2a3a">
<meta property="og:title" content="Road Rush">
<meta property="og:description" content="A free 3D pixel car game. Dodge traffic, collect coins, climb the Top 10.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#7fd1e8;--ink:#fff7e0;--accent:#d9342b;--panel:rgba(22,30,44,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#7fd1e8;--ink:#fff7e0;--panel:rgba(22,30,44,.86)}}
:root[data-theme="dark"]{--bg:#7fd1e8;--ink:#fff7e0;--panel:rgba(22,30,44,.86)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Press Start 2P","Courier New",monospace;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;width:100%;height:100%;touch-action:none}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;font-size:10px;text-shadow:2px 2px 0 #1b2a3a;pointer-events:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
#ov .box{margin:auto auto 10px;animation:rise .25s ease-out;background:var(--panel);border:4px solid var(--ink);padding:24px 20px;max-width:340px;box-shadow:6px 6px 0 #1b2a3a}
h1{font-size:24px;letter-spacing:1px;line-height:1.4;margin:0 0 14px;color:#ffd95a;text-shadow:3px 3px 0 var(--accent)}
p{font-size:10px;line-height:1.9;margin:0 0 16px}
button{font:inherit;font-size:12px;color:var(--ink);background:var(--accent);border:4px solid var(--ink);padding:12px 18px;cursor:pointer;box-shadow:4px 4px 0 #1b2a3a}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b2a3a}
button:focus-visible{outline:4px solid #ffd95a;outline-offset:3px}
#pop{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:14px;color:#ffd95a;text-shadow:3px 3px 0 #1b2a3a;opacity:0;transition:opacity .4s;pointer-events:none}
#spd{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(255,255,255,0) 0 5deg,rgba(255,255,255,.22) 5deg 5.8deg);-webkit-mask-image:radial-gradient(circle at 50% 46%,transparent 38%,#000 85%);mask-image:radial-gradient(circle at 50% 46%,transparent 38%,#000 85%)}
.logo{font-size:36px!important;line-height:1.15;text-shadow:4px 4px 0 var(--accent),8px 8px 0 #1b2a3a}
.pcar{display:block;margin:22px auto 6px;width:70px;height:26px;position:relative;background:var(--accent);box-shadow:0 0 0 3px #1b2a3a;animation:drive 1.2s steps(14,end)}
.pcar::before{content:"";position:absolute;left:18px;top:-14px;width:34px;height:14px;background:#2a3a52}
.pcar::after{content:"";position:absolute;left:8px;bottom:-8px;width:14px;height:14px;background:#111;box-shadow:40px 0 0 #111}
@keyframes drive{from{transform:translateX(-190px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.pcar{animation:none}}
.big button{font-size:15px!important;padding:16px 22px!important}.big p,.big .row{font-size:12px}
.hc{--panel:#000}.hc #hud,.hc #pw,.hc #pop{text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}.hc canvas{filter:contrast(1.25) saturate(1.1)}
#pn,#rcin,#rcin2,#frq,#frn{font:inherit;font-size:10px;padding:8px;border:3px solid var(--ink);background:#0f1722;color:var(--ink);width:150px;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#ov .box{animation:none}}
body.th1{--accent:#7a4fc7;--panel:rgba(14,12,34,.9)}body.th2{--accent:#2fb37a;--ink:#c8ffc8;--panel:rgba(8,24,10,.9)}
#go.play{font-size:20px!important;padding:16px 40px!important;margin:6px 0 2px;background:#2fb37a}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px 8px;margin-top:16px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px!important;border-width:3px!important;font-size:7px!important;min-width:0}
.grid button b{font-size:18px;font-weight:normal;line-height:1}
#bankp{margin:0 0 10px!important;padding:8px 10px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.pu{--c:#fff;--p:100%;position:relative;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--c) var(--p),rgba(0,0,0,.5) 0);display:grid;place-items:center}
.pu::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#1b2a3a}
.pu i{position:relative}
.pu b{position:absolute;right:-6px;bottom:-5px;font-size:8px;font-weight:normal;background:#1b2a3a;padding:1px 3px;border:1px solid var(--ink)}
.pu b:empty{display:none}
.tg{width:48px;height:26px;padding:0!important;position:relative;background:#3a3f4a!important;border-width:3px!important;box-shadow:none!important;min-width:48px!important}
.big .tg{padding:0!important}
.tg i{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--ink);transition:left .15s}
.tg.on{background:#2fb37a!important}.tg.on i{left:24px}
.row.card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);padding:8px}.row.card.cur{border-color:#ffd95a}
#emo{position:absolute;bottom:14px;left:0;right:0;display:none;justify-content:center;gap:10px}
#emo button{padding:6px 10px!important;font-size:16px!important}
#rci{position:absolute;top:56px;left:0;right:0;text-align:center;font-size:9px;text-shadow:2px 2px 0 #1b2a3a;pointer-events:none}
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:72px;color:#ffd95a;text-shadow:5px 5px 0 #1b2a3a;pointer-events:none}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}
#inb{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:none;gap:8px;align-items:center;background:var(--panel);border:3px solid var(--ink);padding:8px 10px;font-size:9px;z-index:5;white-space:nowrap}
#inb button{padding:4px 8px!important;font-size:9px!important}
.fl{position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:14px;color:#ffd23a;text-shadow:2px 2px 0 #1b2a3a;pointer-events:none;animation:fl .8s ease-out forwards}
@keyframes fl{to{transform:translate(-50%,-60px);opacity:0}}@keyframes bump{50%{transform:scale(1.25)}}.bump{animation:bump .25s}
.bar{display:block;height:8px;border:2px solid var(--ink);margin:6px auto 0;width:140px;box-sizing:content-box}.bar b{display:block;height:100%;background:#ffd95a}
#title::after{content:"";display:block;height:6px;margin-top:12px;background:repeating-linear-gradient(90deg,#ffd95a 0 14px,transparent 14px 24px)}
.coin{display:inline-block;width:12px;height:12px;box-sizing:border-box;background:#ffd23a;box-shadow:inset -3px -3px 0 #e0a91b,inset 2px 2px 0 #fff0a0;vertical-align:-2px}
.ic{display:inline-block;width:12px;height:12px;vertical-align:-2px;position:relative;box-sizing:border-box}
.ic-dist{background:#3a3d4a;box-shadow:inset 0 0 0 2px #fff7e0}
.ic-dist::after{content:"";position:absolute;left:5px;top:2px;width:2px;height:8px;background:repeating-linear-gradient(#ffd95a 0 3px,transparent 3px 5px)}
.ic-best{background:#ffd95a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
#hud .cb{padding:3px 6px;border-width:2px;gap:5px}
.cb{display:inline-flex;align-items:center;gap:6px;background:rgba(20,28,40,.78);border:3px solid var(--ink);padding:4px 9px;box-shadow:2px 2px 0 #1b2a3a;font-size:inherit}.cb b{font-weight:normal}
#bankp .cb{font-size:12px}
.q{width:16px;height:16px;padding:0!important;font-size:8px!important;line-height:1;box-shadow:none!important;border:none!important;background:#2a3a52;margin-right:6px;vertical-align:middle}
.big .q{width:20px;height:20px;padding:0!important;font-size:10px!important}
.row>span{flex:1;min-width:0;text-align:left}.row>button{min-width:76px}
.tip{font-size:8px;line-height:1.8;text-align:left;margin:-4px 0 12px;opacity:.9}
.row small{font-size:7px;opacity:.8;line-height:2}
#pw{position:absolute;top:60px;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:10px;color:var(--ink);text-shadow:2px 2px 0 #1b2a3a;pointer-events:none}
#pw .cb{padding:3px 7px;border-width:2px}
#score{display:inline-block;min-width:60px;text-align:right}
.ic-nitro,.ic-shield,.ic-magnet,.ic-combo{box-shadow:inset -3px -3px 0 rgba(0,0,0,.22)}
.ic-nitro{background:#ff8a1f}.ic-shield{background:#66e0ff}.ic-magnet{background:#e05cff}.ic-combo{background:#ffd95a}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;font-size:9px;text-align:left}
.row button{font-size:9px;padding:6px 8px;box-shadow:2px 2px 0 #1b2a3a}.sw{display:inline-block;width:12px;height:12px;margin-right:6px;border:2px solid var(--ink)}
button:disabled{opacity:.6;cursor:default}#ov{overflow:auto}
#hud{align-items:center}#hud button{pointer-events:auto;padding:4px 8px;font-size:10px;border-width:3px;box-shadow:2px 2px 0 #1b2a3a}
#flash{position:absolute;inset:0;background:#ff3b2f;opacity:0;pointer-events:none;transition:opacity .35s}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="spd"></div><div id="flash"></div><div id="pw"></div><div id="pop"></div><div id="rci"></div><div id="emo"><button data-e="0">👍</button><button data-e="1">😂</button><button data-e="2">😮</button></div><div id="cd"></div><div id="inb"><span id="intx"></span><button id="injoin">Join</button><button id="inno">✕</button></div>
  <div id="hud"><span class="cb"><i class="ic ic-dist"></i><b id="score">0 m</b></span><span class="cb"><i class="coin"></i><b id="coins">0</b></span><span class="cb"><i class="ic ic-best"></i><b id="best">0</b></span><button id="mute" aria-label="Toggle sound">♪</button><button id="pause" aria-label="Pause" style="visibility:hidden"><svg width="12" height="12" viewBox="0 0 12 12" style="display:block"><rect x="1" width="4" height="12" fill="currentColor"/><rect x="7" width="4" height="12" fill="currentColor"/></svg></button><button id="fs" aria-label="Fullscreen">⛶</button></div>
  <div id="ov"><div class="box">
    <h1 id="title" class="logo">ROAD<br>RUSH</h1><i class="pcar" id="pcar"></i>
    <p id="bankp"></p>
    <p id="msg">Dodge the traffic. Tap the left or right side of the screen, or use ← → keys, to change lanes.</p>
    <button id="go" class="play">PLAY</button>
    <div id="rstw" style="margin-top:14px;display:none"><button id="rst">Restart</button></div>
    <div id="rvw" style="margin-top:14px;display:none"><button id="rev">Revive</button></div>
    <div id="shw" style="margin-top:14px;display:none"><button id="share">Share score</button></div>
    <div class="grid" id="menug">
      <button id="gbtn"><b>🚗</b>Garage</button><button id="misbtn"><b>🎯</b>Missions</button><button id="lbbtn"><b>🏆</b>Top 10</button><button id="stbtn"><b>📊</b>Stats</button>
      <button id="spbtn"><b>🎡</b>Spin</button><button id="howbtn"><b>❓</b>Help</button><button id="frbtn"><b>🤝</b>Friends</button><button id="rcbtn"><b>🏁</b>Race</button><button id="setbtn"><b>⚙️</b>Settings</button>
    </div>
    <div id="menuw" style="margin-top:14px;display:none"><button id="menu">Main menu</button></div>
    <p id="ver" style="font-size:8px;opacity:.7;margin:14px 0 0">v3.5.0</p>
  </div><div class="box" id="gar" style="display:none"></div><div class="box" id="set" style="display:none"></div><div class="box" id="mis" style="display:none"></div><div class="box" id="how" style="display:none"></div><div class="box" id="stp" style="display:none"></div><div class="box" id="spn" style="display:none"></div><div class="box" id="lb" style="display:none"></div><div class="box" id="rcp" style="display:none"></div><div class="box" id="frp" style="display:none"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var SKY=0x7fd1e8, LANES=[-2.4,0,2.4,4.8],NL=3,SL=3,NLp=3;
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
var scene=new THREE.Scene();
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,35,120);
var camera=new THREE.PerspectiveCamera(60,1,0.1,200);
scene.add(new THREE.AmbientLight(0xffffff,0.65));
var sun=new THREE.DirectionalLight(0xfff0c8,0.8);

sun.position.set(-8,14,6);scene.add(sun);

function resize(){
  var w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;
  var px=[3,2,1.5][save.gfx==null?2:save.gfx];
  renderer.setPixelRatio(1);
  renderer.setSize(Math.floor(w/px),Math.floor(h/px),false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

function mat(c){return new THREE.MeshLambertMaterial({color:c});}
function box(g,w,h,d,x,y,z,c){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);g.add(m);return m;}

// world
var ground=box(scene,220,1,320,0,-0.5,-110,0xe8c27a);
var roadM=box(scene,7.6,0.1,320,0,0.02,-110,0x3a3d4a);
box(scene,0.2,0.12,320,-3.7,0.05,-110,0xf5f0dc);
var edgeR=box(scene,0.2,0.12,320,3.7,0.05,-110,0xf5f0dc);
[[-40,10,0xc9743c],[-10,14,0xb5602f],[28,12,0xc9743c],[55,16,0xb5602f],[-62,12,0xb5602f]].forEach(function(m){
  box(scene,18,m[1],10,m[0],m[1]/2,-112,m[2]);box(scene,11,m[1]*0.5,8,m[0]+1,m[1]+m[1]*0.25,-112,m[2]);
});

var dashes=[],props=[],LOOP=96;
for(var i=0;i<16;i++){
  [-1.2,1.2,3.6].forEach(function(x){dashes.push(box(scene,0.2,0.12,2.2,x,0.05,-i*6,0xf5f0dc));});
}
function makeProp(){
  var g=new THREE.Group();
  var cac=Math.random()<0.65;
  if(cac){
    box(g,0.7,2.6,0.7,0,1.3,0,0x3f9a4a);box(g,0.5,0.5,0.5,-0.6,1.5,0,0x3f9a4a);box(g,0.4,1,0.4,-0.8,1.9,0,0x3f9a4a);
    box(g,0.5,0.5,0.5,0.6,1.1,0,0x3f9a4a);box(g,0.4,0.9,0.4,0.8,1.5,0,0x3f9a4a);
  }else{box(g,1.4,0.9,1.2,0,0.45,0,0x8d8478);box(g,0.8,0.5,0.7,0.2,1.1,0,0x9d9488);}
  g.userData.cap=box(g,1.1,0.3,1.1,0,cac?2.7:1.4,0,0xffffff);g.userData.cap.visible=false;
  return g;
}
for(var j=0;j<22;j++){
  var p=makeProp(),side=j%2?1:-1;
  p.position.set(side*(7.5+Math.random()*14),0,-(j/22)*LOOP);
  scene.add(p);props.push(p);
}
var poles=[];
var RN=300,rpos=new Float32Array(RN*3);
for(var r=0;r<RN;r++){rpos[r*3]=(Math.random()-0.5)*30;rpos[r*3+1]=Math.random()*14;rpos[r*3+2]=-Math.random()*40+6;}
var rainG=new THREE.BufferGeometry();rainG.setAttribute('position',new THREE.BufferAttribute(rpos,3));
var rain=new THREE.Points(rainG,new THREE.PointsMaterial({color:0xcfe3ff,size:0.28,transparent:true,opacity:0}));
rain.frustumCulled=false;rain.visible=false;scene.add(rain);
var bld=[],wc=document.createElement('canvas');wc.width=wc.height=32;
(function(){var x=wc.getContext('2d');x.fillStyle='#d9dee6';x.fillRect(0,0,32,32);for(var a=0;a<4;a++)for(var b=0;b<4;b++){x.fillStyle=Math.random()<0.35?'#ffe28a':'#2a3a52';x.fillRect(a*8+1,b*8+2,5,5);}})();
var wtex=new THREE.CanvasTexture(wc);wtex.wrapS=wtex.wrapT=THREE.RepeatWrapping;wtex.magFilter=THREE.NearestFilter;wtex.minFilter=THREE.NearestFilter;
var BC=[0xb8c4d6,0xd7b9a0,0x9fb3a8,0xc9c9d6,0xa9a3c4];
for(var bi2=0;bi2<16;bi2++){
  var bw=5+Math.random()*4,bh=10+Math.random()*22,bd=6+Math.random()*4,wt=wtex.clone();wt.needsUpdate=true;wt.repeat.set(Math.round(bw/2.5),Math.round(bh/2.5));
  var bm=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),new THREE.MeshLambertMaterial({color:BC[bi2%5],map:wt}));
  bm.position.set((bi2%2?1:-1)*(9+bw/2+Math.random()*5),bh/2,-(bi2/16)*LOOP);bm.visible=false;scene.add(bm);bld.push(bm);
}
var tun=new THREE.Group();
box(tun,10,0.6,320,0,5.2,-110,0x2b2f38);box(tun,0.8,5.5,320,-4.9,2.6,-110,0x3a3f4a);box(tun,0.8,5.5,320,4.9,2.6,-110,0x3a3f4a);
tun.visible=false;scene.add(tun);
var tl=[];for(var ti=0;ti<16;ti++){var tb=box(scene,1.2,0.12,0.6,0,4.8,-ti*6,0xfff3c0);tb.material=new THREE.MeshBasicMaterial({color:0xfff3c0});tb.visible=false;tl.push(tb);}
var brg=new THREE.Group();box(brg,0.25,0.9,320,-3.95,0.5,-110,0x9aa3ad);box(brg,0.25,0.9,320,3.95,0.5,-110,0x9aa3ad);brg.visible=false;scene.add(brg);
var trees=[],palms=[];
for(var ti2=0;ti2<20;ti2++){var tg2=new THREE.Group();box(tg2,0.5,1.8,0.5,0,0.9,0,0x6b4a2b);box(tg2,2.4,1.1,2.4,0,2.3,0,0x2f7a3a);box(tg2,1.7,1.1,1.7,0,3.2,0,0x3a8f46);box(tg2,0.9,1,0.9,0,4.1,0,0x4aa356);tg2.position.set((ti2%2?1:-1)*(7.5+Math.random()*12),0,-(ti2/20)*LOOP);tg2.visible=false;scene.add(tg2);trees.push(tg2);}
for(var pi2=0;pi2<10;pi2++){var pm=new THREE.Group();box(pm,0.4,3.2,0.4,0,1.6,0,0x9a7a4a);box(pm,3,0.2,0.8,0,3.3,0,0x3fae4a);box(pm,0.8,0.2,3,0,3.35,0,0x3fae4a);pm.position.set(7.5+Math.random()*10,0,-(pi2/10)*LOOP);pm.visible=false;scene.add(pm);palms.push(pm);}
var sea=box(scene,100,0.1,320,-62,0.03,-110,0x2f8fd8);sea.visible=false;


for(var l=0;l<12;l++){
  var pg=new THREE.Group();box(pg,0.2,4,0.2,0,2,0,0x333a44);box(pg,1.4,0.2,0.2,0.6,4,0,0x333a44);
  box(pg,0.5,0.2,0.5,1.2,3.85,0,0xfff0b0).material=new THREE.MeshBasicMaterial({color:0xfff0b0});
  pg.position.set(l%2?4.7:-4.7,0,-(l/12)*LOOP);if(!(l%2))pg.rotation.y=Math.PI;
  pg.visible=false;scene.add(pg);poles.push(pg);
}

function makeBase(color){
  var g=new THREE.Group();
  box(g,1.7,0.6,3.4,0,0.6,0,color);
  box(g,1.4,0.5,1.5,0,1.12,0.2,0x253447);
  box(g,1.4,0.1,1.3,0,1.42,0.2,color);
